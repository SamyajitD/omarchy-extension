# monitor-auto.conf
# External-only display behavior for Omarchy/Hyprland via POSIX sh scripts.
#
# Expected scripts:
#   ~/.config/hypr/scripts/auto-display.sh
#   ~/.config/hypr/scripts/monitor-hotplug.sh
#
# You include this file from your main Hyprland config with:
#   source = ~/.config/hypr/custom/monitor-auto.conf

# 1) Start the hotplug listener ONCE per Hyprland session.
#    (exec-once runs only on launch)
exec-once = ~/omarchy-extension/omarchy-hypr-override/scripts/monitor-hotplug.sh

# 2) Also apply the display policy whenever you reload config.
#    (exec runs on each reload)
exec = ~/omarchy-extension/omarchy-hypr-override/scripts/auto-display.sh

# 3) Optional manual keybind: run the policy now (uncomment if you want it).
#    Pick any key you like.
# bind = SUPER, F11, exec, ~/.config/hypr/scripts/auto-display.sh

